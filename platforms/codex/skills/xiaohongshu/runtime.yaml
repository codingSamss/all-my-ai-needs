runtime_version: 1
skill: xiaohongshu
platform: codex

sync_paths:
  - SKILL.md
  - README.md
  - skill.config.json
  - references/opencli-upgrade.md

dependencies:
  commands:
    - node
    - npm
    - opencli

manual_steps:
  - Read references/opencli-upgrade.md before an authorized, version-pinned dependency installation or upgrade.
  - Install the OpenCLI Chrome extension manually.
  - Log into Xiaohongshu in Chrome.

verify:
  - command -v opencli || true
  - node --version
  - opencli --version
  - opencli daemon status

notes:
  - This skill is read-only.
  - HTTP/API and Chrome Cookie DB extraction are intentionally not supported.
  - Do not use opencli doctor for routine checks because it may start the daemon.
  - OpenCLI 1.8.8 features require Node.js >=20.18.1; its original dependency set is not an approved security baseline.
  - Stop the whole batch on SECURITY_BLOCK, AUTH_REQUIRED, captcha, or account warnings.
  - Trace capture is off by default; signed URLs and diagnostics must remain local.
