runtime_version: 1
skill: bilibili
platform: codex

sync_paths:
  - SKILL.md
  - README.md
  - skill.config.json

dependencies:
  commands:
    - bili
    - opencli

manual_steps:
  - pipx install bilibili-cli
  - npm install -g @jackwener/opencli
  - Install the OpenCLI Chrome extension manually for subtitles.

verify:
  - command -v bili
  - bili --version
  - command -v opencli
  - curl -s -A "Mozilla/5.0" "https://api.bilibili.com/x/web-interface/search/all/v2?keyword=test&page=1"

notes:
  - 安装包名为 bilibili-cli，实际入口命令为 bili；依赖检查以 command -v bili 为准。
  - This skill is read-only.
  - Use video-transcribe for full transcripts, frames, or Obsidian notes.
  - Do not use yt-dlp as the default Bilibili reader.
