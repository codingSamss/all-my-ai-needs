runtime_version: 1
skill: aihot
platform: codex

sync_paths:
  - SKILL.md
  - agents/openai.yaml
  - LICENSE

origin:
  repo: https://github.com/KKKKhazix/khazix-skills
  path: aihot
  ref: 1e6adab5ecfbc36156071295a0d3e7757d50c53e
  version: 2.0.0
  license: MIT
  local_adaptations:
    - SKILL.md 与 upstream 2.0.0 逐字节一致；查询入口改为 /api/v1/agent，旧参考文件随 upstream 移除。
    - README.md 保留 upstream 内容并补充本仓库同步范围与验证命令，只留在 repo 供人阅读。
    - 不下发 upstream 的 install.sh 与 manifest.sha256；本仓库由 AI 直接同步文件，不走远端安装器。
    - 不生成或持久化 .aihot-actor-id；文件缺失时按 upstream 合同使用不带 Actor 的基础 User-Agent 继续请求。
    - 不下发安装器生成的 .gitignore 与本地状态文件，也不创建跨平台 symlink。
    - Claude 不下发 agents/；Codex 保留 upstream 的 agents/openai.yaml。

dependencies:
  commands:
    - curl
    - rg
  notes:
    - 通过 https://aihot.news/api/v1/agent 及其查询入口发起匿名只读 GET，返回 Markdown，不需要 API Key、cookie 或 MCP server。
    - 默认使用 SKILL.md 当前版本定义的基础 User-Agent，不生成或附加 Actor 标识。

manual_steps:
  - 新增或更新后需开启新的 Codex 会话，确保运行时重新扫描 Skill。
  - 重要数字、政策和原话必须回第三方原文核对，AIHOT 摘要不作为唯一事实来源。

verify:
  - test -f SKILL.md
  - test -f LICENSE
  - test ! -d references
  - test -f agents/openai.yaml
  - |
    rg -q '^name: aihot$' SKILL.md
  # 版本从正文现读，避免上游升版后仍使用旧 User-Agent。
  - |
    v=$(grep -m1 '^  version:' SKILL.md | tr -d ' "' | cut -d: -f2)
    rg -Fq "aihot-skill/$v" SKILL.md
  # 2.0 返回 Markdown；同时验证使用说明和资讯入口，不能沿用旧 JSON 字段断言。
  - |
    v=$(grep -m1 '^  version:' SKILL.md | tr -d ' "' | cut -d: -f2)
    for endpoint in agent 'agent/latest?limit=1'; do
      response=$(curl -fsS --compressed --max-time 20 -H "User-Agent: aihot-skill/$v (+https://aihot.news/aihot-skill/)" "https://aihot.news/api/v1/$endpoint")
      printf '%s\n' "$response" | rg -q '^# AIHOT'
    done
