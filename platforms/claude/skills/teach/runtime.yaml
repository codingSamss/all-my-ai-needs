runtime_version: 1
skill: teach
platform: claude

origin:
  repo: https://github.com/mattpocock/skills
  path: skills/productivity/teach
  ref: ed37663cc5fbef691ddfecd080dff42f7e7e350d
  license: MIT
  local_adaptations:
    - SKILL.md 省略 upstream 的 disable-model-invocation 与 argument-hint frontmatter，以符合当前仓库的双平台 metadata 约束。

sync_paths:
  - SKILL.md
  - MISSION-FORMAT.md
  - RESOURCES-FORMAT.md
  - LEARNING-RECORD-FORMAT.md
  - GLOSSARY-FORMAT.md
  - LICENSE
  - NOTICE.md
  - skill.config.json

dependencies:
  commands: []
  notes:
    - 纯指令型 teaching workspace skill，无运行时依赖。

manual_steps:
  - 使用前建议在独立学习目录中触发，避免在项目根目录或 Obsidian 根目录生成学习文件。
  - 新增或同步后需重启 Claude Code 才能加载最新 skill 列表。

verify:
  - test -f SKILL.md
  - test -f MISSION-FORMAT.md
  - test -f RESOURCES-FORMAT.md
  - test -f LEARNING-RECORD-FORMAT.md
  - test -f GLOSSARY-FORMAT.md
  - grep -q '^## Assets' SKILL.md
