runtime_version: 1
skill: handoff
platform: claude

origin:
  repo: https://github.com/mattpocock/skills
  path: skills/productivity/handoff
  ref: 697d4ce9
  license: MIT
  relationship: derived
  notes:
    - 本地 SKILL.md 是重写版（约 5.9KB），upstream 仅 879 字节，不是副本关系。
    - 2026-08-06 核对 bddb833c→697d4ce9 区间：upstream 对 SKILL.md 的唯一改动是一句 `PRDs`→`specs`，
      该句不存在于本地重写版，无需跟进；锚点刷新只为记录已核对到 697d4ce9。

sync_paths:
  - SKILL.md
  - LICENSE
  - NOTICE.md

dependencies:
  commands: []
  notes:
    - 纯指令型 handoff skill，无运行时依赖。
    - 本地版本保留 upstream 的 OS 临时目录交接能力，同时扩展 Obsidian `07_交接台` 与 iCloud `AgentArtifacts` 持久接力规范。

manual_steps:
  - 普通换线程默认把交接文档写入 OS 临时目录，避免污染当前 workspace。
  - 涉及多机器、远程 Codex/Claude Code、Obsidian 或知识库交接台时，按 `07_交接台` 任务父目录写入，并把大型产物放到 `AgentArtifacts`。
  - 新增或同步后需重启 Claude Code 才能加载最新 skill 列表。

verify:
  - test -f SKILL.md
  - test -f NOTICE.md
  - test -f LICENSE
  - grep -q "07_交接台" SKILL.md
  - grep -q "AgentArtifacts" SKILL.md

notes:
  - 2026-08-06 随 orbit-os 1.6.1 一并从 `08_交接台` 改为 `07_交接台`，与 Vault 实际结构对齐。
  - 交接台目录编号由 orbit-os 定义；orbit-os 再次重编号时，本 skill 的 SKILL.md、NOTICE.md
    与 verify 断言必须同步改，否则两者口径冲突。
