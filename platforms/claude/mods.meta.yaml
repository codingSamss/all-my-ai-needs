schema_version: 1
platform: claude
policy: manual-only
mods:
  pixel-buddy:
    plugin_id: pixel-buddy-sam@codingSamss-all-my-ai-needs-mods
    version: 1.0.0-rc.12
    source: mods/pixel-buddy/source
    origin: mods/pixel-buddy/origin.json
    install: python3 platforms/claude/mods/pixel-buddy/install.py
    scope: user
    status: candidate
    automatic_updates: false
    notes:
      - CC 小人和沙漏表示等待前台/后台脚本及 subagent，按宿主事件与完整快照归并；未知状态不误报完成
      - 优先按宿主有效压缩窗口计算占用率和高亮，无有效窗口时明确回退模型 ctx
      - 保留原生目录入口与提示槽，右侧省略压缩标签以保留完整分母；首轮响应前明确显示等待状态
      - SMIL 内置宠物动画，随浅深主题切换昼夜；分钟级额度面板与秒级 cache 底栏分离，持续性能验收待完成
      - 安装器生成本机 marketplace；根 marketplace 继续只提供现有 skills 插件
      - pixel-at-work 的 MIT 绘图子集随包分发，固定提交和 SHA-256；额度区收窄 80px，动画高 54px
      - 原版已启用、已有源码漂移或同插件正在安装时停止，不自动切换
      - 新会话现场验收前保持 candidate；不重启 App 或重载现有会话
