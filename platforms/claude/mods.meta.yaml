schema_version: 1
platform: claude
policy: manual-only
mods:
  pixel-buddy:
    plugin_id: pixel-buddy-sam@codingSamss-all-my-ai-needs-mods
    version: 1.0.0-rc.23
    source: mods/pixel-buddy/source
    origin: mods/pixel-buddy/origin.json
    install: python3 platforms/claude/mods/pixel-buddy/install.py
    scope: user
    status: candidate
    automatic_updates: false
    notes:
      - 缺失快照保留已确认的后台任务，快照里不认识的状态词只忽略单条；同会话重载接续追踪，启动/重新连接时补一次代理状态，未知范围不误报完成
      - 子代理通知带宿主声明外壳时同样识别，续接会话补发的 stopped 视为终态；主回合结束清掉未返回的前台调用，后台任务不受影响
      - 宿主的监视类与内部维护类任务（如已发布 Artifact 的评论监视，会话期间一直 running）不计入等待；重载接续时也不带过旧记录
      - 只读命令 /buddy-status 列出插件记着的后台任务 ID、类型、是否被宿主快照确认和代理列表状态，以及被忽略的监视类任务；不写状态、不轮询
      - 主会话真实压缩与工作优先于后台等待；主会话不工作且仍有任务时显示等回信，旧会话回调不能清除新会话动画
      - 主会话真实压缩期间播放压纸机，结束或失败恢复原状态；预计算与子会话不占用主场景
      - 宠物住在同一间固定小房间，状态只更换中间舞台的动作和道具；小人只有两只小眼睛，没有嘴；54px 高度与浅深配色，大面积底色透明贴合宿主面板，未知状态静止，不增加轮询
      - 思考、干活、回复来自响应块种类；等你只覆盖提问与计划确认弹窗；出错与中断各闪现约 6 秒；咖啡热气与杯色随 cache 剩余寿命，只在跨过半寿命和过期时换画面
      - 等回信小人每 8 秒踮脚偷瞄、眨眼和轻晃后安静等候；邮箱保持为空，不编码完成进度，减弱动态效果时静止
      - 独立底栏按引擎实际压缩阈值显示彩色百分比与当前用量/阈值；本地 summary 按上下文或相关设置变化读取，不随秒表轮询
      - 安装器生成本机 marketplace；根 marketplace 继续只提供现有 skills 插件
      - pixel-at-work 的 MIT 绘图子集随包分发，固定提交和 SHA-256；额度区收窄 80px，动画高 54px
      - 原版已启用、已有源码漂移或同插件正在安装时停止，不自动切换
      - 新会话现场验收前保持 candidate；不重启 App 或重载现有会话
